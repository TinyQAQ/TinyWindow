name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: swift run tinywindow-checks
      - name: Build release artifacts (dmg + zip)
        run: CODESIGN_ID=- scripts/release.sh
      - name: Create or update GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/TinyWindow-*.dmg dist/TinyWindow-*.zip dist/*.sha256 --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            dist/TinyWindow-*.dmg dist/TinyWindow-*.zip dist/*.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
